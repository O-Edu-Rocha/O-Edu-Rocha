<svg width="800" height="280" viewBox="0 0 800 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { font-family: 'Courier New', monospace; fill: #C9D1D9; font-size: 14px; font-weight: bold; }
    .title { fill: #8B0000; font-size: 18px; }
    .footer { fill: #8B0000; font-size: 13px; }
    .dot { fill: #8B0000; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .bar1 { animation: fill1 2s ease-out forwards; }
    .bar2 { animation: fill2 2s ease-out forwards; }
    .bar3 { animation: fill3 2s ease-out forwards; }
    
    /* Configuração do "enchimento" das barras */
    @keyframes fill1 { from { width: 0; } to { width: 380px; } }
    @keyframes fill2 { from { width: 0; } to { width: 320px; } }
    @keyframes fill3 { from { width: 0; } to { width: 410px; } }
  </style>
  
  <!-- Fundo e Borda -->
  <rect x="10" y="10" width="780" height="260" rx="8" fill="#0D1117" stroke="#8B0000" stroke-width="1.5"/>
  
  <!-- Cabeçalho -->
  <text x="35" y="50" class="text title">LUIZ SYSTEM // DEVELOPMENT STATUS</text>
  <text x="700" y="48" class="text" font-size="12px">ONLINE</text>
  <circle cx="760" cy="44" r="5" class="dot"/>
  <line x1="35" y1="65" x2="765" y2="65" stroke="#30363D" stroke-width="1"/>

  <!-- Linha 1: Data Science -->
  <text x="35" y="110" class="text">DATA SCIENCE &amp; AI</text>
  <rect x="270" y="100" width="450" height="12" rx="6" fill="#21262D"/>
  <rect x="270" y="100" width="0" height="12" rx="6" fill="#8B0000" class="bar1"/>

  <!-- Linha 2: Web Dev -> Applications -->
  <text x="35" y="155" class="text">APPLICATIONS</text>
  <rect x="270" y="145" width="450" height="12" rx="6" fill="#21262D"/>
  <rect x="270" y="145" width="0" height="12" rx="6" fill="#8B0000" class="bar2"/>

  <!-- Linha 3: Projeto Atual -> Dashboards -->
  <text x="35" y="200" class="text">INTERACTIVE DASHBOARDS</text>
  <rect x="270" y="190" width="450" height="12" rx="6" fill="#21262D"/>
  <rect x="270" y="190" width="0" height="12" rx="6" fill="#8B0000" class="bar3"/>

  <!-- Rodapé -->
  <text x="35" y="240" class="text footer">&gt; syncing development modules...</text>
  <text x="35" y="260" class="text footer">&gt; CODE - ANALYZE - AUTOMATE - EVOLVE</text>
</svg>
